<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Task Manager</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <div class="container">
    <header>
      <h1>&#10003; Task Manager</h1>
      <p class="subtitle">Stay organised. Get things done.</p>
    </header>

    <!-- Add Task Form -->
    <section class="add-task-card">
      <h2>Add New Task</h2>
      <form id="taskForm">
        <div class="form-row">
          <input
            type="text"
            id="taskInput"
            placeholder="What needs to be done?"
            maxlength="120"
            autocomplete="off"
            required
          />
          <select id="prioritySelect">
            <option value="low">Low</option>
            <option value="medium" selected>Medium</option>
            <option value="high">High</option>
          </select>
          <button type="submit" class="btn btn-primary">Add Task</button>
        </div>
      </form>
    </section>

    <!-- Filter Bar -->
    <section class="filter-bar">
      <div class="filter-buttons">
        <button class="filter-btn active" data-filter="all">All</button>
        <button class="filter-btn" data-filter="active">Active</button>
        <button class="filter-btn" data-filter="completed">Completed</button>
      </div>
      <button id="clearCompleted" class="btn btn-danger-outline">Clear Completed</button>
    </section>

    <!-- Stats Bar -->
    <div class="stats-bar">
      <span id="statsText">0 tasks total</span>
    </div>

    <!-- Task List -->
    <ul id="taskList" class="task-list"></ul>

    <!-- Empty state -->
    <div id="emptyState" class="empty-state hidden">
      <p>No tasks here. Add one above!</p>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
